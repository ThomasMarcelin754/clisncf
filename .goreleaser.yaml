version: 2

project_name: sncfcli

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/sncf
    binary: sncfcli
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
      - GOMAXPROCS=2
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

sboms:
  - artifacts: archive
    cmd: syft
    args: ["${artifact}", "--output", "spdx-json=${document}"]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: ThomasMarcelin754
    name: clisncf
  draft: false
  prerelease: auto

homebrew_casks:
  - name: sncfcli
    description: "CLI for SNCF Connect — search trains, book tickets, manage your account"
    homepage: "https://github.com/ThomasMarcelin754/clisncf"
    directory: Casks
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    url:
      verified: "github.com/ThomasMarcelin754/clisncf"
    repository:
      owner: ThomasMarcelin754
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/sncfcli"]
          end
